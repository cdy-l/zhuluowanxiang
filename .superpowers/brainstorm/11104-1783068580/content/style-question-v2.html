<!DOCTYPE html><html><head><meta charset="UTF-8"><title>蛛罗万象 风格选择</title><style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f5f7fa;padding:2rem;max-width:800px;margin:0 auto}h2{font-size:1.5rem;color:#1d1d1f;margin-bottom:0.5rem}.subtitle{color:#86868b;margin-bottom:1.5rem}.options{display:flex;flex-direction:column;gap:0.75rem}.option{background:#fff;border:2px solid #d1d1d6;border-radius:12px;padding:1rem 1.25rem;cursor:pointer;display:flex;align-items:flex-start;gap:1rem;transition:all 0.15s ease}.option:hover,.option.selected{border-color:#0071e3;background:#e8f4fd}.letter{background:#e5e5e7;color:#86868b;width:1.75rem;height:1.75rem;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}.option.selected .letter{background:#0071e3;color:#fff}.content{flex:1}.content h3{font-size:0.95rem;margin-bottom:0.15rem}.content p{color:#86868b;font-size:0.85rem}</style></head><body><h2>你想要的「蛛罗万象」更接近哪种感觉？</h2><p class="subtitle">这会影响整体架构和前端风格的选择</p><div class="options" data-multiselect><div class="option" data-choice="dashboard" onclick="this.classList.toggle(&apos;selected&apos;)"><div class="letter">A</div><div class="content"><h3>仪表盘/控制台风格</h3><p>类似数据中心监控面板，左侧导航栏，右侧功能区，卡片式布局展示各个爬虫模块</p></div></div><div class="option" data-choice="toolkit" onclick="this.classList.toggle(&apos;selected&apos;)"><div class="letter">B</div><div class="content"><h3>工具箱/启动器风格</h3><p>类似应用启动器/工具箱，每个爬虫是一个大图标卡片，点击直接进入功能页面</p></div></div><div class="option" data-choice="terminal" onclick="this.classList.toggle(&apos;selected&apos;)"><div class="letter">C</div><div class="content"><h3>终端/Hacker风格</h3><p>深色背景绿色文字，类似黑客帝国风格，命令行交互与可视化结合</p></div></div><div class="option" data-choice="mixed" onclick="this.classList.toggle(&apos;selected&apos;)"><div class="letter">D</div><div class="content"><h3>混合/自定义</h3><p>我有自己的想法，或者想融合以上多种风格</p></div></div></div></body></html>
