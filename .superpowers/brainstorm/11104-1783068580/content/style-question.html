<h2>你想要的「蛛罗万象」更接近哪种感觉？</h2>
<p class="subtitle">这会影响整体架构和前端风格的选择</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="dashboard" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>仪表盘/控制台风格</h3>
      <p>类似数据中心监控面板，左侧导航栏，右侧功能区，卡片式布局展示各个爬虫模块</p>
    </div>
  </div>
  <div class="option" data-choice="toolkit" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>工具箱/启动器风格</h3>
      <p>类似应用启动器/工具箱，每个爬虫是一个大图标卡片，点击直接进入功能页面</p>
    </div>
  </div>
  <div class="option" data-choice="terminal" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>终端/Hacker风格</h3>
      <p>深色背景绿色文字，类似黑客帝国风格，命令行交互与可视化结合</p>
    </div>
  </div>
  <div class="option" data-choice="mixed" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>混合/自定义</h3>
      <p>我有自己的想法，或者想融合以上多种风格</p>
    </div>
  </div>
</div>
