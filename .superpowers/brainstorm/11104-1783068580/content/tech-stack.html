<!DOCTYPE html><html><head><meta charset="UTF-8"><title>技术选型</title><style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f5f7fa;padding:2rem;max-width:800px;margin:0 auto}h2{font-size:1.5rem;color:#1d1d1f;margin-bottom:0.5rem}.subtitle{color:#86868b;margin-bottom:1.5rem}.options{display:flex;flex-direction:column;gap:0.75rem}.option{background:#fff;border:2px solid #d1d1d6;border-radius:12px;padding:1rem 1.25rem;cursor:pointer;display:flex;align-items:flex-start;gap:1rem;transition:all 0.15s ease}.option:hover,.option.selected{border-color:#0071e3;background:#e8f4fd}.letter{background:#e5e5e7;color:#86868b;width:1.75rem;height:1.75rem;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}.option.selected .letter{background:#0071e3;color:#fff}.content{flex:1}.content h3{font-size:0.95rem;margin-bottom:0.15rem}.content p{color:#86868b;font-size:0.85rem}</style></head><body><h2>技术选型确认</h2><p class="subtitle">你已选择 仪表盘/控制台风格，接下来确认技术栈</p><div class="options"><div class="option" data-choice="fastapi" onclick="this.classList.toggle(&apos;selected&apos;)"><div class="letter">A</div><div class="content"><h3>FastAPI（推荐）</h3><p>Python 异步框架，自动生成 API 文档，性能优秀，生态丰富</p></div></div><div class="option" data-choice="flask" onclick="this.classList.toggle(&apos;selected&apos;)"><div class="letter">B</div><div class="content"><h3>Flask</h3><p>轻量灵活，简单直接，但需要更多手动配置</p></div></div><div class="option" data-choice="django" onclick="this.classList.toggle(&apos;selected&apos;)"><div class="letter">C</div><div class="content"><h3>Django</h3><p>大而全，但相对较重，对于这个项目可能有些过度</p></div></div></div></body></html>
